name: lsp-integration
version: "1.2.0"
description: >-
  Auto LSP diagnostics for patch/write_file operations, on-demand
  `lsp_diagnostics`, navigation tools (`lsp_goto_definition`,
  `lsp_find_references`), and persistent server management with
  idle cleanup. Supports 30 languages.
hooks:
  - transform_tool_result
requires_env: []
