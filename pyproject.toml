[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-plugin-lsp-integration"
version = "1.1.0"
description = "LSP diagnostics plugin for Hermes Agent – auto-runs after file edits and provides on-demand diagnostics for 30+ languages"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{name = "Your Name", email = "you@example.com"}]
keywords = ["hermes", "agent", "lsp", "diagnostics"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Intelligent Agents",
]

[project.entry-points."hermes_agent.plugins"]
lsp_integration = "hermes_plugin_lsp_integration"

[project.urls]
Homepage = "https://github.com/yourusername/hermes-agent-lsp-plugin"
Repository = "https://github.com/yourusername/hermes-agent-lsp-plugin"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages]
find = {}

[tool.setuptools.package-data]
"*" = ["*.yaml", "*.md"]
